<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=presentation.html">
    <title>PetPulse Master Presentation Redirect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-dark: #060B14;
            --glass-bg: rgba(10, 22, 45, 0.6);
            --glass-border: rgba(0, 229, 255, 0.2);
            --text-primary: #E2ECF8;
            --text-secondary: #90A4AE;
            --accent-cyan: #00E5FF;
            --accent-purple: #D500F9;
            --shadow-glow: 0 0 25px rgba(0, 229, 255, 0.15);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: linear-gradient(-45deg, #050B14, #0D162D, #162447, #0A192F);
            background-size: 400% 400%;
            animation: nebulaFlow 20s ease infinite;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes nebulaFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .redirect-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-glow);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: paneIn 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes paneIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0 0 25px 0;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 229, 255, 0.15);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-action {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-cyan), #00A2C9);
            color: #000;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(0,229,255,0.3);
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0,229,255,0.5);
        }

        .redirect-note {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent-cyan);
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="redirect-panel">
        <div class="loader-spinner"></div>
        <h2>Moving to Master Presentation</h2>
        <p>
            We have unified all business slides and technical specifications into a single premium interactive experience. Redirecting you now...
        </p>
        <a href="presentation.html" class="btn-action" onclick="playChime()">Enter Presentation</a>
        <div class="redirect-note">> Redirecting in 3 seconds...</div>
    </div>

    <script>
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtxClass();

        function playChime() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (err) {
                console.warn('Audio Context failed:', err);
            }
        }
    </script>
</body>
</html>
