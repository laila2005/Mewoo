# PetPulse — automated dependency monitoring (F-17).
#
# The security assessment found 32 known CVEs across the two npm trees
# (19 frontend, 13 backend), including one in DOMPurify — the library the
# app relies on for sanitization. All were cleared, but nothing was watching
# for the next one. This closes that gap: Dependabot opens a PR when a
# dependency has a published advisory or a new version.
#
# Security updates are raised regardless of the schedule below; the weekly
# interval controls routine version bumps only.

version: 2
updates:
  # The repo root carries its own manifest — Vercel builds the serverless
  # function from it, so it mirrors backend/ and drifts out of sync silently.
  # It was unwatched until now, which is where a third of the open advisories
  # had accumulated.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      root-minor-patch:
        update-types:
          - minor
          - patch

  # Dev-only PDF/PPT generators. Nothing ships from here, but the advisories
  # still count against the repo, so they are watched too.
  - package-ecosystem: npm
    directory: /docs/scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per weekly batch of routine bumps, so the queue stays readable.
      # Security fixes still arrive as their own PRs.
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /petpulse-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # The repo runs GitHub Actions (see .github/workflows). Pinned action
  # versions go stale and carry their own advisories, so they are watched too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
